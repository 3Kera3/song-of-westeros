<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes · Song of Westeros</title>
  <meta name="description" content="Cartes interactives de Westeros : régions, ressources et routes commerciales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="cartes">
<main>
  <div class="wrap">
    <div class="map-layout">
      <aside class="map-side">
        <div>
          <p class="eyebrow" style="margin-bottom:8px">Le royaume</p>
          <h1>Cartes de Westeros</h1>
        </div>
        <div id="map-tabs" role="tablist" aria-label="Choix de la carte"></div>
        <p id="map-desc"></p>
        <input class="search" id="place-search" type="search" placeholder="Rechercher un lieu" autocomplete="off" hidden>
        <div id="map-places"></div>
        <div class="map-actions">
          <button type="button" id="map-full">Plein écran</button>
          <a id="map-open" target="_blank" rel="noopener" download>Télécharger</a>
          <button type="button" id="map-pick" title="Cliquez sur la carte pour obtenir la ligne à ajouter dans donnees/lieux.csv">Placer un repère</button>
        </div>
      </aside>
      <div id="map-shell">
        <div id="map"></div>
        <div class="map-help">Molette ou pincement pour zoomer, glisser pour se déplacer</div>
      </div>
    </div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
